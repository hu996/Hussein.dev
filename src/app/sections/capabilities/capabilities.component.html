<section class="capabilities">
  <div class="container">
    <div class="header">
      <h2>{{ i18n.labels().sections.capabilitiesTitle }}</h2>
      <p>{{ i18n.labels().sections.capabilitiesSubtitle }}</p>
    </div>
    <div class="capabilities-grid">
      <div class="capability-card" *ngFor="let cap of capabilities">
        <span class="icon">→</span>
        <h3>{{ cap }}</h3>
      </div>
    </div>
  </div>
</section>
