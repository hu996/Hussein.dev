<section class="capabilities">
  <div class="container">
    <div class="header">
      <h2>Technical Capabilities</h2>
      <p>Services and expertise delivered across enterprise projects</p>
    </div>
    <div class="capabilities-grid">
      <div class="capability-card" *ngFor="let cap of capabilities">
        <span class="icon">→</span>
        <h3>{{ cap }}</h3>
      </div>
    </div>
  </div>
</section>
