<section id="skills" class="skills reveal">
  <div class="wrap">
    <span class="section-kicker">Tech Stack</span>
    <h3>Technical Expertise</h3>
    <div class="groups">
      <div class="group" *ngFor="let group of groups">
        <h4>{{ group.name }}</h4>
        <app-skill-badge *ngFor="let s of group.items" [label]="s"></app-skill-badge>
      </div>
    </div>
  </div>
</section>
