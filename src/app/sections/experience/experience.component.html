<section id="experience" class="experience reveal">
  <div class="wrap">
    <span class="section-kicker">{{ i18n.labels().sections.careerKicker }}</span>
    <h3>{{ i18n.labels().sections.careerTitle }}</h3>
    <div class="list">
      <app-experience-card *ngFor="let it of items" [item]="it"></app-experience-card>
    </div>
  </div>
</section>
