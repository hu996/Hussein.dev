<nav class="navbar" [class.scrolled]="isScrolled">
  <a class="brand" href="#hero" (click)="closeMenu()">Hussein.dev</a>
  <button class="burger" (click)="toggle()" aria-label="Toggle menu" [attr.aria-expanded]="isOpen">
    <span [class.open]="isOpen"></span>
  </button>
  <ul [class.open]="isOpen" class="links">
    <li *ngFor="let link of links">
      <a [href]="'#' + link.id" [class.active]="activeSection === link.id" (click)="closeMenu()">{{ link.label }}</a>
    </li>
    <li><a class="nav-cta" href="assets/files/Hussein_Antar_CV.pdf" download="Hussein_Antar_CV.pdf" (click)="closeMenu()">Download CV</a></li>
  </ul>
</nav>
